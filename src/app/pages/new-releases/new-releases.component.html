<h1>Recently Uploaded</h1>
<h3>{{ count$ | async }} Recent Uploads</h3>

@if ((count$ | async) > 0) {
  <app-release-list
    [releases]="results$ | async"
    (releaseListOpen)="open($event)"
  >
  </app-release-list>
}

@if ((count$ | async) > 0) {
  <mat-paginator
    [pageSizeOptions]="pageSizes"
    [pageIndex]="offset / pageSize"
    [pageSize]="pageSize"
    (page)="paginationChange($event)"
    [length]="count$ | async"
    [pageSize]="10"
  ></mat-paginator>
}
