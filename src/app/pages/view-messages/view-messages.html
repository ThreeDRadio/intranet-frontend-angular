@if (this.messageBankStore.isLoading()) {
<h3>Loading messages...</h3>
} @else {
<h1>View Messages</h1>
<form class="horizontal-search-form">
  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Category</mat-label>
    <mat-select>
      <mat-option value="all">All</mat-option>
    </mat-select>
  </mat-form-field>
</form>
<mat-divider></mat-divider>
@for (msg of this.messageBankStore.results(); track msg.id) {
<div class="card-container">
  <app-message-header [message]="msg"></app-message-header>
</div>
} }
