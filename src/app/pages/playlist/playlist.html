@if (store.isLoading()) {
<h4>Loading...</h4>
} @else { @if (playlist(); as pl) {
<h1>Logging Sheet - {{ show().name }}</h1>
<h3 style="opacity: 0.7">{{ formattedDate() }}</h3>
<app-quota-display
  [quotas]="this.quotaService.getQuotas(this.quotaParams(), this.entries())"
  [counts]="this.quotaService.getCounts(this.entries())"
  [totalDuration]="this.totalDuration()"
></app-quota-display>
<app-playlist-entry-list
  [playlist]="pl"
  [entries]="this.entries()"
></app-playlist-entry-list>
} @else {
<h4>Loading logging sheet...</h4>
} }
