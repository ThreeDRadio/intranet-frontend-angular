@if (store.isLoading()) {
<h4>Loading playlist...</h4>
} @else { @if (playlist(); as pl) {
<h1>EDITING Logging Sheet - {{ show().name }}</h1>
<h3 style="opacity: 0.7">{{ formattedDate() }}</h3>
<app-quota-display
  [quotas]="this.quotas()"
  [totalDuration]="this.totalDuration()"
></app-quota-display>
<app-playlist-entry-list
  [playlist]="pl"
  [entries]="this.entries()"
  [action]="edit"
></app-playlist-entry-list>
} }
