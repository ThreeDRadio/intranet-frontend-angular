@if (store.isLoading()) {
  <h4>Loading recent logging sheets...</h4>
} @else {
  @for (byDate of playlistsByDate(); track byDate.date) {
    <h1>{{ this.dateService.getDisplayDate(byDate.date) }}</h1>
    <mat-divider />
    <div class="card-container">
      @for (playlist of byDate.playlists; track playlist.id) {
        <app-playlist-header [playlist]="playlist"></app-playlist-header>
      }
    </div>
  } @empty {
    <h4>No recent logging sheets.</h4>
  }
}
