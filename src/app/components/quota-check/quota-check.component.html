<div
  class="custom-box mat-elevation-z4"
  [class]="this.met() ? 'quota-met' : 'quota-unmet'"
>
  @if (this.svg()) {
    <mat-icon [svgIcon]="this.icon()"></mat-icon>
  } @else {
    <mat-icon>{{ this.icon() }}</mat-icon>
  }
  @if (this.met()) {
    <mat-icon>check</mat-icon>
  } @else {
    <mat-icon>close</mat-icon>
  }
</div>
