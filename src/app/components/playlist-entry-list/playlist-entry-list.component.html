@if (playlist(); as pl) {
  <div>
    @for (entry of entries(); track entry.id) {
      @if (action() === "view") {
        <app-playlist-entry [input]="entry" />
      } @else {
        <app-playlist-entry-editor
          [input]="entry"
          action="edit"
          (deletion)="entryDeleted.emit($event)"
          (saved)="entrySaved.emit($event)"
        />
      }
    }
  </div>
}
