@if (this.playlist(); as pl) {
  <div>
    @for (entry of this.entries(); track entry.id) {
      @if (this.action() === "view") {
        <app-playlist-entry [input]="entry" action="view" />
      } @else {
        <app-playlist-entry
          [input]="entry"
          action="edit"
          (deletion)="onEntryDeleted($event)"
        />
      }
    }
  </div>
}
