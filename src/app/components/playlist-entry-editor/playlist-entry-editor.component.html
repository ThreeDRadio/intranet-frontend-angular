@if (input(); as entry) {
  <div
    cdkDrag
    cdkDragLockAxis="y"
    [class]="shadow() ? 'editor-div' : 'editor-div-no-shadow'"
  >
    <div cdkDragHandle style="align-items: center">
      <mat-icon>drag_indicator</mat-icon>
    </div>
    <!-- User can only click and drag from this handle -->
    <span style="min-width: 30px">
      @if (entry.index > 0) {
        <span>#{{ entry.index }}</span>
      }
    </span>

    <mat-icon>person</mat-icon>
    <input
      matInput
      matTooltip="Artist"
      placeholder="Artist"
      [value]="entry.artist"
      [formControl]="artistControl"
      class="standalone-input med-input"
    />
    <mat-icon>music_note</mat-icon>
    <input
      matTooltip="Song Title"
      placeholder="Song"
      [value]="entry.title"
      [formControl]="songControl"
      class="standalone-input med-input"
    />
    <mat-icon>album</mat-icon>
    <input
      matInput
      matTooltip="Album"
      placeholder="Album"
      [value]="entry.album"
      [formControl]="albumControl"
      class="standalone-input med-input"
    />
    <mat-icon>av_timer</mat-icon>
    <input
      matInput
      matTooltip="Duration"
      placeholder="MM:SS"
      [value]="entry.duration"
      [formControl]="durationControl"
      class="standalone-input short-input"
      type="text"
      style="text-align: center"
    />
    <span style="width: 100%; max-width: 8px"></span>
    <div class="checkbox-container">
      <mat-icon svgIcon="local-icon"></mat-icon>
      <mat-checkbox
        [checked]="quotas().local"
        (change)="onQuotaChanged($event, 'local')"
      ></mat-checkbox>
    </div>

    <div class="checkbox-container">
      <mat-icon svgIcon="aus-icon"></mat-icon>
      <mat-checkbox
        [checked]="quotas().australian"
        (change)="onQuotaChanged($event, 'australian')"
      ></mat-checkbox>
    </div>

    <div class="checkbox-container">
      <mat-icon>female</mat-icon>
      <mat-checkbox
        [checked]="quotas().female"
        (change)="onQuotaChanged($event, 'female')"
      ></mat-checkbox>
    </div>

    <div class="checkbox-container">
      <mat-icon>fiber_new</mat-icon>
      <mat-checkbox
        [checked]="quotas().newRelease"
        (change)="onQuotaChanged($event, 'newRelease')"
      ></mat-checkbox>
    </div>
    <span style="width: 100%; max-width: 8px"></span>
    <div>
      @if (action() === "create") {
        <button
          matFab
          extended
          color="primary"
          aria-label="Add"
          [disabled]="!canSave()"
          (click)="save()"
        >
          <mat-icon>add</mat-icon>
          Add
        </button>
        <button
          matFab
          extended
          color="accent"
          aria-label="Clear"
          [disabled]="!canClear()"
          (click)="clear()"
        >
          <mat-icon>clear_all</mat-icon>
          Clear
        </button>
      } @else {
        <button
          matFab
          extended
          color="primary"
          aria-label="Save"
          [disabled]="!canSave()"
          (click)="save()"
        >
          <mat-icon>save</mat-icon>
          Save
        </button>
        <button
          matFab
          extended
          aria-label="Undo"
          color="accent"
          [disabled]="!canUndo()"
          (click)="undo()"
        >
          <mat-icon>undo</mat-icon>
          Undo
        </button>
      }
    </div>
    <!-- Deletion to the right -->
    @if (this.action() !== "create") {
      <span class="spacer"></span>
      <div class="remove-button-container">
        <button
          matFab
          extended
          aria-label="Remove"
          color="warn"
          (click)="deletion.emit(entry.index)"
        >
          <mat-icon>close</mat-icon>
          Remove
        </button>
      </div>
    }
  </div>
}
