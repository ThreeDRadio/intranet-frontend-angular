@if (this.quotas(); as q) {
  <div class="quota-container">
    <app-quota-indicator
      svg="true"
      icon="local-icon"
      [quota]="q.local"
    ></app-quota-indicator>
    <app-quota-indicator
      svg="true"
      icon="aus-icon"
      [quota]="q.australian"
    ></app-quota-indicator>
    <app-quota-indicator icon="female" [quota]="q.female"></app-quota-indicator>
    @if (this.counts(); as c) {
      <app-quota-count
        icon="fiber_new"
        [count]="c.newRelease"
      ></app-quota-count>
    }
    <app-duration-indicator
      [duration]="totalDuration()"
    ></app-duration-indicator>
  </div>
} @else {
  <h4>Loading quota display...</h4>
}
