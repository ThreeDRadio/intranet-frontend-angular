@if (state() === "good") {
  <div class="custom-box mat-elevation-z4 quota-met">
    @if (this.svg()) {
      <mat-icon [svgIcon]="this.icon()"></mat-icon>
    } @else {
      <mat-icon>{{ this.icon() }}</mat-icon>
    }

    <mat-icon>check</mat-icon>
  </div>
} @else if (state() === "question") {
  <div class="custom-box mat-elevation-z4 quota-unsure-informational">
    @if (this.svg()) {
      <mat-icon [svgIcon]="this.icon()"></mat-icon>
    } @else {
      <mat-icon>{{ this.icon() }}</mat-icon>
    }

    <mat-icon>question_mark</mat-icon>
  </div>
} @else {
  <div class="custom-box mat-elevation-z4 quota-unmet-informational">
    @if (this.svg()) {
      <mat-icon [svgIcon]="this.icon()"></mat-icon>
    } @else {
      <mat-icon>{{ this.icon() }}</mat-icon>
    }

    <mat-icon>remove</mat-icon>
  </div>
}
