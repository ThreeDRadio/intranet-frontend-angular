<!-- confirm-dialog.component.html -->
<h2 mat-dialog-title>{{ this.data.title }}</h2>
<mat-dialog-content>{{ this.data.message }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false">
    {{ this.data.cancelButton ?? "Cancel" }}
  </button>
  <button
    mat-button
    [mat-dialog-close]="true"
    [color]="this.data.resultOutcome === 'constructive' ? 'secondary' : 'warn'"
  >
    {{ this.data.confirmButton ?? "Confirm" }}
  </button>
</mat-dialog-actions>
