<div
  class="custom-box mat-elevation-z4"
  [class]="met ? 'quota-met ' : 'quota-unmet '"
>
  @if (this.svg()) {
    <mat-icon [svgIcon]="this.icon()"></mat-icon>
  } @else {
    <mat-icon>{{ this.icon() }}</mat-icon>
  }
  @if (quota(); as q) {
    {{ q.count }}/{{ q.quota }}
  } @else {
    ?/?
  }
</div>
