@if (this.message(); as msg) {
<mat-card>
  <mat-card-header>
    <mat-card-title>
      {{ msg.code }} - {{ msg.title }}
      <div
        style="display: flex; flex-direction: row; align-items: center"
      ></div>
    </mat-card-title>
    <mat-card-subtitle>
      Expires {{ this.dateService.getDisplayDate(msg?.expirydate ?? "") }} - {{
      this.durationService.toVerboseReadableFromSeconds(msg.duration) }} -
      produced by {{ msg.fldproducer }}
    </mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <i>"{{ msg.nq }}"</i>
    <mat-divider></mat-divider>
  </mat-card-content>
</mat-card>
}
