@if ((loading$ | async) === false) {
  @for (comment of comments; track comment.id) {
    <mat-divider />
    <div class="comments-list">
      <mat-card
        class="comment-card"
        (click)="comment?.visible && commentSelected.emit(comment)"
      >
        <mat-card-content class="comment-card-flex">
          <div class="comment-card-flex-author">
            <img
              [src]="comment.author?.gravatar + '?d=retro'"
              alt="Author Gravatar"
            />
            <br />
            <span style="text-align: center">
              {{ comment.author?.first_name + " " + comment.author?.last_name }}
            </span>
          </div>

          <div class="comment-card-flex-comment">
            <div class="comment-card-flex-comment-container">
              <strong>
                {{ comment.release.artist }} - {{ comment.release.title }}
              </strong>
              <br />
              {{ comment.comment }}
            </div>
          </div>

          @if (isModerator) {
            <button
              matFab
              class="comment-card-flex-mod-remove"
              color="primary"
              aria-label="Remove this comment."
              (click)="onVisibilityClicked($event, comment)"
            >
              <mat-icon>delete_forever</mat-icon>
            </button>
          }
        </mat-card-content>
      </mat-card>
    </div>
    <mat-divider />
  }
} @else {
  <mat-spinner></mat-spinner>
}
