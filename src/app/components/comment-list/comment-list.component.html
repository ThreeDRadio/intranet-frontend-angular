@if ((loading$ | async) === false) {
  @for (comment of comments; track comment.id) {
    <mat-divider />
    <div class="comments-list">
      <mat-card
        class="comment-card"
        (click)="comment?.visible && commentSelected.emit(comment)"
      >
        <mat-card-content
          style="display: flex; flex-direction: row; align-items: flex-start"
        >
          <!-- Author Section (Fixed structural wrapper width) -->
          <div
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              margin-right: 16px;
              min-width: 100px;
            "
          >
            <img
              [src]="comment.author?.gravatar + '?d=retro'"
              alt="Author Gravatar"
            />
            <br />
            <span style="text-align: center">
              {{ comment.author?.first_name + " " + comment.author?.last_name }}
            </span>
          </div>

          <!-- Comment Content Section (Takes up all remaining space) -->
          <div style="flex: 1">
            <div style="display: flex; flex-direction: column">
              <strong>
                {{ comment.release.artist }} - {{ comment.release.title }}
              </strong>
              <br />
              <div class="comment-text">{{ comment.comment }}</div>
            </div>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
    <mat-divider />
  }
