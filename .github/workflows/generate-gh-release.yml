name: Create a release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Select the SemVer type to bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  run-tests:
    # Use ubuntu-20.04 or ubuntu-22.04 because newer environments drop support for legacy binaries.
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository
      - name: Checkout Code
        uses: actions/checkout@v7

      # Step 2: Provision Node.js 22 environment
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm" # Speeds up subsequent workflow runs

      # Step 3: Install precise dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Run Angular unit tests headlessly
      - name: Run Angular Tests
        run: npm run test

  update-version:
    needs: run-tests
    environment: test
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          
      - name: Make changes and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ github.event.inputs.version_bump }}
          git push origin main --tags
          
      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "pkg_version=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.get_version.outputs.pkg_version }}"
          name: "${{ steps.get_version.outputs.pkg_version }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          token: ${{ steps.generate-token.outputs.token }}
